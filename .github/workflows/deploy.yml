name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - env:
          SITE_DOMAIN: erabiyori.jp
        run: node scripts/build_site.mjs
      # この手順が Not Found で落ちる場合、リポジトリで Pages が未設定。
      # enablement: true も試したが、GITHUB_TOKEN には Pages を作る権限が無く
      # 「Resource not accessible by integration」で拒否される（要リポジトリ管理者）。
      # 直すには Settings → Pages → Build and deployment → Source: GitHub Actions を
      # 一度だけ手で選ぶ。以後はこのワークフローだけで配信できる。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
